name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go for pinned sing-box engine
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3

      - name: Install pinned Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "ndk;28.0.13004108"
          yes | sdkmanager --licenses

      - name: Build official sing-box libbox for arm64
        run: ./scripts/build-libbox-android.sh

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run tests and build debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: H-MAGHSODI-arm64-debug
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 14
